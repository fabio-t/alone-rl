name: Release

# Pushing a tag like 0.3.0 builds itch.io-ready zips for Linux, Windows and
# macOS (bundled JRE + game data + .itch.toml), attaches them to a GitHub
# release, and publishes them to itch.io. The workflow can also be run
# manually (Actions -> Release -> Run workflow) with a tag name: the tag is
# then created at the chosen ref as part of the release.
#
# Only stable tags reach itch.io: a tag with a pre-release suffix
# (0.4.0-rc1, v1.0.0-beta2) is published as a GitHub pre-release and the
# itch.io step is skipped.
#
# The itch.io step is optional and skips itself unless both are configured
# in the repository settings (Settings -> Secrets and variables -> Actions):
#
#   secret   BUTLER_API_KEY  from https://itch.io/user/settings/api-keys
#   variable ITCH_TARGET     the itch.io project, e.g. fabioticconi/alone-rl
on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.3.0); created at the chosen ref if it doesn't exist yet"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # Apple Silicon only: GitHub retired the Intel (macos-13) runners
          - os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the release version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$RELEASE_VERSION"

      - name: Package for itch.io
        run: ./gradlew itchPackage -PreleaseVersion="$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: itch-${{ matrix.os }}
          path: build/itch/alone-rl-*.zip

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/alone-rl-*.zip
          generate_release_notes: true
          # a tag with a suffix (0.4.0-rc1, v1.0.0-beta2) is a pre-release
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  itch:
    name: Publish to itch.io
    needs: package
    runs-on: ubuntu-latest
    # players get stable releases only: a pre-release tag (0.4.0-rc1) still
    # builds and lands on GitHub, but is never pushed to itch.io
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Push builds with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          # accepted as a repository variable or, if it was added there
          # instead, as a secret — it is not sensitive either way
          ITCH_TARGET: ${{ vars.ITCH_TARGET || secrets.ITCH_TARGET }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          missing=""
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            missing="BUTLER_API_KEY (secret)"
          fi
          if [ -z "${ITCH_TARGET:-}" ]; then
            missing="${missing:+$missing and }ITCH_TARGET (variable, e.g. myuser/alone-rl)"
          fi

          if [ -n "$missing" ]; then
            echo "::notice::itch.io publish skipped: $missing is not set on this repository."
            exit 0
          fi

          echo "publishing to $ITCH_TARGET"

          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

          version="${TAG#v}"

          push_channel() {
            local zip
            zip=$(ls artifacts/$1 2>/dev/null | head -1 || true)

            if [ -z "$zip" ]; then
              echo "::warning::no artifact matching $1; skipping the $2 channel"
              return
            fi

            echo "pushing $zip -> $ITCH_TARGET:$2"
            ./butler push "$zip" "$ITCH_TARGET:$2" --userversion "$version"
          }

          push_channel 'alone-rl-*-linux-x86_64.zip' linux
          push_channel 'alone-rl-*-windows-x86_64.zip' windows
          push_channel 'alone-rl-*-macos-aarch64.zip' osx

          ./butler status "$ITCH_TARGET"
