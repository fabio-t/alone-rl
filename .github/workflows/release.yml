name: Release

# Pushing a tag like 0.3.0 builds itch.io-ready zips for Linux, Windows and
# macOS (bundled JRE + native terrain library + game data + .itch.toml) and
# attaches them to a GitHub release. The workflow can also be run manually
# (Actions -> Release -> Run workflow) with a tag name: the tag is then
# created at the chosen ref as part of the release. Push the zips to
# itch.io with butler:
#
#   butler push alone-rl-<version>-linux-x86_64.zip   <user>/alone-rl:linux
#   butler push alone-rl-<version>-windows-x86_64.zip <user>/alone-rl:windows
#   butler push alone-rl-<version>-macos-aarch64.zip  <user>/alone-rl:mac
on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.3.0); created at the chosen ref if it doesn't exist yet"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # Apple Silicon only: GitHub retired the Intel (macos-13) runners
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: ./gradlew build

      - name: Package for itch.io
        run: ./gradlew itchPackage

      - uses: actions/upload-artifact@v4
        with:
          name: itch-${{ matrix.os }}
          path: build/itch/alone-rl-*.zip

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/alone-rl-*.zip
          generate_release_notes: true
